[package]
name = "taurio"
version = "0.0.0"
description = "Shared Tauri 2 native setup: window appearance and common plugin registration"
authors = ["Hans Kristoffer"]
edition = "2021"
rust-version = "1.88"
publish = false

[features]
# Nothing by default: each consumer picks what it uses.
default = []
# Transparent webview over macOS vibrancy. A no-op elsewhere. The app still
# enables tauri's `macos-private-api` feature and `macOSPrivateApi` in its config.
window = ["dep:window-vibrancy"]
# dialog and opener everywhere; window-state, updater and process on desktop.
plugins = [
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
]

[dependencies]
# No default features: the app's own tauri features (macos-private-api, tray-icon,
# wry) unify with this, and nothing here switches more on.
tauri = { version = "2", default-features = false }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = { version = "0.6", optional = true }

# Target conditions, not cfg(desktop): that one is set by tauri-build in the app's
# build script and does not reach dependency crates.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
