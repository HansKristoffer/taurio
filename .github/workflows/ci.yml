name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # macOS covers both sides of the native code: vibrancy on macOS, and the
  # mobile cfg branches through the iOS simulator target.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
