name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  # Keeps a release PR open with the next version and changelog. Merging it
  # bumps the npm package and the crate together, tags vX.Y.Z and creates the
  # GitHub release; the jobs below then publish both at that tag.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm only packs the package folder; the README and licenses live at the root.
      - run: cp README.md LICENSE-MIT LICENSE-APACHE packages/taurio/
      # Skips a version already on npm, so a failed run can be rerun.
      - name: npm publish
        working-directory: packages/taurio
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@hanskristoffer/taurio@$version" version >/dev/null 2>&1; then
            echo "@hanskristoffer/taurio@$version is already published"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance needs a public repository.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
  publish-crate:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    # macOS: cargo publish builds the crate to verify it, and tauri's Linux
    # dependencies would need the GTK and WebKit system packages first.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Skips a version already on crates.io, so a failed run can be rerun.
      - name: cargo publish
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "taurio") | .version')
          if curl -sf -A "taurio-release (https://github.com/HansKristoffer/taurio)" "https://crates.io/api/v1/crates/taurio/$version" >/dev/null; then
            echo "taurio $version is already on crates.io"
          else
            cargo publish -p taurio --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
